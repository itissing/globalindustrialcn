
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Global Industrial — Industrial products and solutions.">
  <title>Global Industrial | Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
      background: #f5f7fa;
      line-height: 1.6;
    }
    header {
      background: #12345a;
      color: white;
      padding: 22px 8%;
    }
    header h1 { margin: 0; font-size: 25px; }
    main {
      max-width: 900px;
      margin: 70px auto;
      padding: 0 24px;
      text-align: center;
    }
    .panel {
      background: white;
      padding: 48px 28px;
      border-radius: 12px;
      box-shadow: 0 5px 24px rgba(0,0,0,.06);
    }
    h2 { font-size: 34px; margin-top: 0; color: #12345a; }
    p { color: #596579; font-size: 17px; }
    footer {
      text-align: center;
      padding: 24px;
      color: #6b7280;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      main { margin: 32px auto; }
      h2 { font-size: 27px; }
      .panel { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Global Industrial</h1>
  </header>

  <main>
    <section class="panel">
      <h2>Welcome to Global Industrial</h2>
      <p>
        We are building our online presence to better serve
        our customers and partners around the world.
      </p>
      <p>Thank you for visiting our website.</p>
    </section>
  </main>

  <footer>
    &copy; 2026 Global Industrial. All rights reserved.
  </footer>
</body>
</html>
